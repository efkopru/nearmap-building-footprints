name: CPU tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check correctness rules
        run: |
          python -m pip install ruff==0.16.9
          ruff check --output-format=github .

  cpu:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.12', '3.13']
    defaults:
      run:
        # Fail on the first failing command on every OS. Windows' default shell,
        # PowerShell, only reports the exit code of a step's last command.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-cpu.lock
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements-cpu.lock
          python -m pip install --no-deps -e .
      - name: Test CPU workflow and adapters
        run: python -m coverage run -m pytest -q
      - name: Report coverage
        run: |
          python -m coverage combine
          python -m coverage report
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise synthetic CLI pipeline
        run: |
          nbf doctor
          nbf demo --output data/ci_demo
          nbf inspect data/ci_demo/imagery.tif
          nbf tile data/ci_demo/imagery.tif --output data/ci_tiles --tile-size 256 --overlap 64
          nbf infer --manifest data/ci_tiles/manifest.json --method text --output outputs/ci_plan
          nbf clean --input data/ci_demo/perfect_predictions.gpkg --output outputs/ci_cleaned.gpkg --metric-crs EPSG:32614
          nbf evaluate --predictions outputs/ci_cleaned.gpkg --predictions-layer cleaned --reference data/ci_demo/reference.gpkg --aoi data/ci_demo/aoi.geojson --metric-crs EPSG:32614 --output-json outputs/ci_metrics.json --output-gpkg outputs/ci_matches.gpkg --independent-holdout --size-bins-m2 20 50 100
          nbf import-vectors --input data/ci_demo/reference.gpkg --output outputs/ci_imported.gpkg --crs EPSG:32614 --id-field building_id
          nbf evaluate --predictions outputs/ci_imported.gpkg --reference data/ci_demo/reference.gpkg --aoi data/ci_demo/aoi.geojson --metric-crs EPSG:32614 --output-json outputs/ci_imported_metrics.json --independent-holdout --size-bins-m2 20 50 100
          nbf import-vectors --input data/ci_demo/esri_format_predictions.gdb --layer esri_buildings --preset esri --crs EPSG:32614 --output outputs/ci_esri/raw.gpkg
          nbf clean --input outputs/ci_esri/raw.gpkg --output outputs/ci_esri/cleaned.gpkg --metric-crs EPSG:32614
          nbf evaluate --predictions outputs/ci_esri/cleaned.gpkg --predictions-layer cleaned --reference data/ci_demo/reference.gpkg --aoi data/ci_demo/aoi.geojson --metric-crs EPSG:32614 --output-json outputs/ci_esri/evaluation.json --independent-holdout --size-bins-m2 20 50 100
          nbf compare --reports outputs/ci_metrics.json outputs/ci_imported_metrics.json outputs/ci_esri/evaluation.json --labels cleaned imported esri --output outputs/ci_comparison.csv --per-building outputs/ci_per_building.gpkg --by-size outputs/ci_by_size.csv
          nbf review-check --original data/ci_demo/reference.gpkg --reviewed outputs/ci_imported.gpkg --aoi data/ci_demo/aoi.geojson --metric-crs EPSG:32614 --output-json outputs/ci_review.json --output-gpkg outputs/ci_review.gpkg
          nbf agree --predictions outputs/ci_cleaned.gpkg outputs/ci_esri/cleaned.gpkg --layers cleaned cleaned --labels cleaned esri --reports outputs/ci_metrics.json outputs/ci_esri/evaluation.json --aoi data/ci_demo/aoi.geojson --metric-crs EPSG:32614 --output-json outputs/ci_agree.json --output-gpkg outputs/ci_agree.gpkg
          nbf esri-chunks plan --manifest data/ci_tiles/manifest.json --output data/ci_chunks --core 256 --overlap 32
          nbf esri-chunks run --chunks data/ci_chunks --gdb outputs/ci_chunks.gdb --done outputs/ci_done --model usa_building_footprints.dlpk
          nbf train prepare-coco --manifest data/ci_tiles/manifest.json --ground-truth data/ci_demo/reference.gpkg --split-aois data/ci_demo/splits.geojson --output data/ci_training --labels-complete --skip-unassigned

  torch:
    # Checkpoint export and loading with real PyTorch; the main job uses a stand-in.
    name: Checkpoints with PyTorch (CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cpu.lock
      - name: Install CPU dependencies and CPU-only PyTorch
        run: |
          python -m pip install -r requirements-cpu.lock
          python -m pip install --no-deps -e .
          # The same Torch release scripts/setup_sam3.sh installs, as the CPU-only build.
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Export and load checkpoints
        run: python -m pytest -q tests/test_checkpoint_torch.py tests/test_training.py tests/test_inference.py

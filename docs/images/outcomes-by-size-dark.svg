<svg xmlns="http://www.w3.org/2000/svg" width="840" height="393" viewBox="0 0 840 393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="839" height="392" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="32" y="44" font-size="21" font-weight="700" text-anchor="start" fill="#ffffff">Both models find most large buildings; neither finds most small ones</text>
<text x="32" y="70" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7">What happened to each building on Lewisville's 2015 map, by building area</text>
<rect x="32" y="91" width="14" height="14" rx="3" fill="#9085e9"/>
<text x="54" y="103" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7">Found by both</text>
<rect x="188.6" y="91" width="14" height="14" rx="3" fill="#e66767"/>
<text x="210.6" y="103" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7">Only Esri Mask R-CNN</text>
<rect x="402.6" y="91" width="14" height="14" rx="3" fill="#3987e5"/>
<text x="424.6" y="103" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7">Only SAM 3</text>
<rect x="534.6" y="91" width="14" height="14" rx="3" fill="#46463f"/>
<text x="556.6" y="103" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7">Missed by both</text>
<text x="32" y="142" font-size="15" font-weight="600" text-anchor="start" fill="#ffffff">100 m² and up</text>
<text x="32" y="160" font-size="13" font-weight="400" text-anchor="start" fill="#898781">26,959 buildings</text>
<rect x="300" y="128" width="442.137" height="30" rx="0" fill="#9085e9"/>
<text x="308" y="148" font-size="13" font-weight="600" text-anchor="start" fill="#0b0b0b">89%</text>
<rect x="744.137" y="128" width="25.1338" height="30" rx="0" fill="#e66767"/>
<rect x="771.271" y="128" width="3.52691" height="30" rx="0" fill="#3987e5"/>
<rect x="776.798" y="128" width="21.2019" height="30" rx="0" fill="#46463f"/>
<text x="32" y="194" font-size="15" font-weight="600" text-anchor="start" fill="#ffffff">50–100 m²</text>
<text x="32" y="212" font-size="13" font-weight="400" text-anchor="start" fill="#898781">1,710 buildings</text>
<rect x="300" y="180" width="152.971" height="30" rx="0" fill="#9085e9"/>
<text x="308" y="200" font-size="13" font-weight="600" text-anchor="start" fill="#0b0b0b">31%</text>
<rect x="454.971" y="180" width="105.018" height="30" rx="0" fill="#e66767"/>
<text x="462.971" y="200" font-size="13" font-weight="600" text-anchor="start" fill="#0b0b0b">21%</text>
<rect x="561.988" y="180" width="38.6433" height="30" rx="0" fill="#3987e5"/>
<rect x="602.632" y="180" width="195.368" height="30" rx="0" fill="#46463f"/>
<text x="610.632" y="200" font-size="13" font-weight="600" text-anchor="start" fill="#ffffff">39%</text>
<text x="32" y="246" font-size="15" font-weight="600" text-anchor="start" fill="#ffffff">20–50 m²</text>
<text x="32" y="264" font-size="13" font-weight="400" text-anchor="start" fill="#898781">2,346 buildings</text>
<rect x="300" y="232" width="20.8048" height="30" rx="0" fill="#9085e9"/>
<rect x="322.805" y="232" width="16.5422" height="30" rx="0" fill="#e66767"/>
<rect x="341.347" y="232" width="98.1705" height="30" rx="0" fill="#3987e5"/>
<text x="349.347" y="252" font-size="13" font-weight="600" text-anchor="start" fill="#0b0b0b">20%</text>
<rect x="441.517" y="232" width="356.483" height="30" rx="0" fill="#46463f"/>
<text x="449.517" y="252" font-size="13" font-weight="600" text-anchor="start" fill="#ffffff">72%</text>
<text x="32" y="298" font-size="15" font-weight="600" text-anchor="start" fill="#ffffff">Under 20 m²</text>
<text x="32" y="316" font-size="13" font-weight="400" text-anchor="start" fill="#898781">7,867 buildings</text>
<rect x="300.127" y="284" width="14.9061" height="30" rx="0" fill="#3987e5"/>
<rect x="317.033" y="284" width="480.967" height="30" rx="0" fill="#46463f"/>
<text x="325.033" y="304" font-size="13" font-weight="600" text-anchor="start" fill="#ffffff">97%</text>
<text x="32" y="358" font-size="12" font-weight="400" text-anchor="start" fill="#898781">Whole city, May 2026 imagery. Some buildings missed by both were demolished after 2015.</text>
<text x="32" y="375" font-size="12" font-weight="400" text-anchor="start" fill="#898781">Esri Mask R-CNN: the city's run of Esri's Building Footprint Extraction – USA model.</text>

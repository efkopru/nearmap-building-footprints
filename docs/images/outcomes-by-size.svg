<text x="556.6" y="103" font-size="14" font-weight="400" text-anchor="start" fill="#52514e">Missed by both</text>
<text x="32" y="142" font-size="15" font-weight="600" text-anchor="start" fill="#0b0b0b">100 m² and up</text>
<text x="32" y="160" font-size="13" font-weight="400" text-anchor="start" fill="#898781">26,959 buildings</text>

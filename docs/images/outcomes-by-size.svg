<rect x="771.271" y="128" width="3.52691" height="30" rx="0" fill="#2a78d6"/>
<rect x="776.798" y="128" width="21.2019" height="30" rx="0" fill="#d6d5ce"/>
<text x="32" y="194" font-size="15" font-weight="600" text-anchor="start" fill="#0b0b0b">50–100 m²</text>
<text x="32" y="212" font-size="13" font-weight="400" text-anchor="start" fill="#898781">1,710 buildings</text>
<rect x="300" y="180" width="152.971" height="30" rx="0" fill="#4a3aa7"/>
<text x="308" y="200" font-size="13" font-weight="600" text-anchor="start" fill="#ffffff">31%</text>

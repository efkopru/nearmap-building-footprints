<rect x="602.632" y="180" width="195.368" height="30" rx="0" fill="#d6d5ce"/>
<text x="610.632" y="200" font-size="13" font-weight="600" text-anchor="start" fill="#0b0b0b">39%</text>
<text x="32" y="246" font-size="15" font-weight="600" text-anchor="start" fill="#0b0b0b">20–50 m²</text>
<text x="32" y="264" font-size="13" font-weight="400" text-anchor="start" fill="#898781">2,346 buildings</text>
<rect x="300" y="232" width="20.8048" height="30" rx="0" fill="#4a3aa7"/>
<rect x="322.805" y="232" width="16.5422" height="30" rx="0" fill="#e34948"/>

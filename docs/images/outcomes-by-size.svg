<svg xmlns="http://www.w3.org/2000/svg" width="840" height="393" viewBox="0 0 840 393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="839" height="392" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>

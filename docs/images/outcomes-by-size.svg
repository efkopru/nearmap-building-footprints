<text x="349.347" y="252" font-size="13" font-weight="600" text-anchor="start" fill="#ffffff">20%</text>
<rect x="441.517" y="232" width="356.483" height="30" rx="0" fill="#d6d5ce"/>
<text x="449.517" y="252" font-size="13" font-weight="600" text-anchor="start" fill="#0b0b0b">72%</text>
<text x="32" y="298" font-size="15" font-weight="600" text-anchor="start" fill="#0b0b0b">Under 20 m²</text>
<text x="32" y="316" font-size="13" font-weight="400" text-anchor="start" fill="#898781">7,867 buildings</text>
<rect x="300.127" y="284" width="14.9061" height="30" rx="0" fill="#2a78d6"/>
<rect x="317.033" y="284" width="480.967" height="30" rx="0" fill="#d6d5ce"/>
<text x="325.033" y="304" font-size="13" font-weight="600" text-anchor="start" fill="#0b0b0b">97%</text>
<text x="32" y="358" font-size="12" font-weight="400" text-anchor="start" fill="#898781">Whole city, May 2026 imagery. Some buildings missed by both were demolished after 2015.</text>
<text x="32" y="375" font-size="12" font-weight="400" text-anchor="start" fill="#898781">Esri Mask R-CNN: the city's run of Esri's Building Footprint Extraction – USA model.</text>
